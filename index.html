<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déo Assistante Fiscalité</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:15px}
.header{background:#0a5c36;color:white;padding:20px;border-radius:15px;text-align:center}
.header h1{margin:0;font-size:26px}
#search{width:100%;padding:14px;font-size:16px;border-radius:10px;border:2px solid #0a5c36;box-sizing:border-box;margin-top:15px}
.card{background:white;padding:15px;margin-top:10px;border-radius:12px;box-shadow:0 2px 5px #ccc}
.question{font-weight:bold;cursor:pointer}
.answer{display:none;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="header">
<h1>🎓 Déo Assistante Fiscalité</h1>
<p>Créateur : Déo</p>
<p>Questions et réponses préparées par ton Assistante</p>
</div>
<input id="search" onkeyup="afficher()" placeholder="Pose ta question... ex: TVA, IPR...">
<div id="liste"></div>
<script>
const data=[
{q:"C'est quoi la TVA ?",a:"Taxe sur la Valeur Ajoutée. Le consommateur paie quand il achète. En RDC, 16%."},
{q:"C'est quoi l'IPR ?",a:"Impôt Professionnel sur les Rémunérations. Retenu sur le salaire chaque mois."},
{q:"C'est quoi l'Impôt sur les Sociétés ?",a:"Impôt que paie une entreprise sur son bénéfice."},
{q:"C'est quoi la DGI, DGDA, DGRAD ?",a:"DGI = Impôts. DGDA = Douane. DGRAD = Recettes administratives."},
{q:"Différence entre taxe, impôt et redevance ?",a:"Impôt : sans service direct. Taxe : pour un service précis. Redevance : pour utiliser un bien de l'État."},
{q:"C'est quoi l'assiette fiscale ?",a:"La base de calcul. Pour l'IPR c'est le salaire, pour l'IS c'est le bénéfice, pour la TVA c'est le prix."},
{q:"Pourquoi la TVA est neutre pour l'entreprise ?",a:"L'entreprise collecte, enlève ce qu'elle a payé, et donne la différence à l'État."},
{q:"Une entreprise qui vend à perte paie la TVA ?",a:"Oui. La TVA ne dépend pas du bénéfice."},
{q:"Si je ne paie pas l'impôt, prison ?",a:"Retard = amende. Fraude grave avec faux documents = prison."},
{q:"La fiscalité aide le Congo ?",a:"Oui, si l'argent est bien utilisé. Routes, écoles, hôpitaux."},
];
function afficher(){
let m=document.getElementById('search').value.toLowerCase();
let l=data.filter(d=>d.q.toLowerCase().includes(m)||d.a.toLowerCase().includes(m));
document.getElementById('liste').innerHTML=l.map((d,i)=>`<div class="card"><div class="question" onclick="let e=document.getElementById('r${i}');e.style.display=e.style.display=='block'?'none':'block'">❓ ${d.q}</div><div class="answer" id="r${i}">✅ ${d.a}</div></div>`).join('');
}
afficher();
</script>
<p style="text-align:center;color:#999;font-size:13px">© Déo Assistante Fiscalité - Créé par Déo</p>
</body>
</html>
