<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TEST</title><style>body{background:#0f0f1e;color:white;font-family:Arial;padding:15px}button{padding:12px;margin:5px;border-radius:20px}.card{background:#1e1e35;padding:15px;border-radius:15px;margin-top:10px}</style></head>
<body>
<h1>DEO IA TEST</h1>
<button onclick="go('a')">Accueil</button>
<button onclick="go('b')">Mes Cours</button>
<button onclick="go('c')">Question</button>
<div id="a" class="card"><h2>Accueil</h2><p>Appuie sur Mes Cours</p></div>
<div id="b" class="card" style="display:none"><h2>Mes Cours</h2><p>BRAVO CA MARCHE !</p><p>TVA 16% - IBP 30%</p></div>
<div id="c" class="card" style="display:none"><h2>Question</h2><p>Si tu vois ca, les boutons marchent !</p></div>
<script>
function go(x){
document.getElementById("a").style.display="none";
document.getElementById("b").style.display="none";
document.getElementById("c").style.display="none";
document.getElementById(x).style.display="block";
}
</script>
</body></html>
